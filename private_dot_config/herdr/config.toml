onboarding = false

[ui]
pane_gaps = false
pane_outer_borders = false
pane_borders = "auto"

status_indicators = "symbols"
[keys]
prefix = "ctrl+p"
focus_pane_left = "alt+left"
focus_pane_right = "alt+right"
focus_pane_up = "alt+up"
focus_pane_down = "alt+down"
new_tab = "prefix+t"
rename_tab = "prefix+r"
previous_tab = "alt+shift+left"
next_tab = "alt+shift+right"
move_tab_previous = "prefix+left"
move_tab_next = "prefix+right"
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"
split_horizontal = "prefix+d"
split_vertical = "prefix+n"
zoom = "prefix+f"
copy_mode = "prefix+shift+e"
resize_mode = "prefix+shift+r"
reload_config = "prefix+ctrl+r"
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

[[keys.command]]
key = "alt+f"
type = "popup"
command = "$SHELL"
width = "60%"
height = "60%"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"
