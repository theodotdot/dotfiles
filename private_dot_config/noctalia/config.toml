[bar.default]
background_opacity = 0.74999998323619366
border = "primary"
center = [ "group:g1" ]
end = [ "caffeine", "network", "volume", "tray", "notifications", "session" ]
margin_edge = 3
margin_ends = 550
margin_opposite_edge = 3
radius = 20
shadow = false
start = [ "workspaces", "keyboard_layout", "media" ]
widget_spacing = 10

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    right = "annotate"

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 0.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "weather" ]
    opacity = 1.0
    padding = 9.0

[battery.device."/org/freedesktop/UPower/devices/keyboard_dev_CF_F7_A1_B2_07_60"]
warning_threshold = 10

[brightness]
enable_ddcutil = true

[calendar]

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "audio"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "screen-off", "lock", "suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1200

    [idle.behavior.suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 1800

[location]
address = "Berlin, Germany"

[lockscreen]
allow_empty_password = false
blur_intensity = 0.5
blurred_desktop = false
edge_smoothness = 0.29999999999999999
enabled = true
fingerprint = false
lock_before_suspend = true
monitors = []
tint_intensity = 0.29999999999999999
transition = [ "fade" ]
transition_duration = 1500
wallpaper = ""

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
