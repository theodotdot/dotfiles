[notification]
background_opacity = 0.75
history_retention_hours = 48
layer = "overlay"

[osd]
border = false

[shell]
app_icon_color = "primary"
avatar_path = "/home/theotime/Downloads/momo.png"
clipboard_auto_paste = "off"
font_family = "MonoLisa Nerd Font"
polkit_agent = true
popup_shadows = false
settings_window_translucent = true

    [shell.animation]
    speed = 1.2500000186264515

    [shell.greeter_sync]
    auto_sync = true

    [shell.keyboard_layout.custom_labels]
    "English (US, intl., with dead keys)" = "usintl"
    "French (Ergo‑L)" = "ergol"

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false
    show_app_origin_indicator = false
    show_icons = true

        [shell.launcher.providers.calculator]
        global = false

    [shell.screenshot]
    annotate = true
    confirm_region = true
    save_to_file = false
    show_cursor = true
    skip_annotate_on_copy_save = true

    [shell.session]
    show_shortcuts = false

    [shell.panel]
    transparency_mode = "soft"

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Mauve"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/theotime/Downloads/walls"

    [wallpaper.automation]
    enabled = false

    [wallpaper.default]
    path = "/home/theotime/Downloads/walls/anime-forest_catppuccin-macchiato.png"

    [wallpaper.last]
    path = "/home/theotime/Downloads/walls/anime-forest_catppuccin-macchiato.png"

    [wallpaper.monitors.DP-2]
    path = "/home/theotime/Downloads/walls/anime-forest_catppuccin-macchiato.png"

[widget.clock]
format = "%A, %d %B  %H:%M "

[widget.keyboard_layout]
icon_color = "primary"

[widget.media]
hide_when_no_media = true
icon_color = "primary"
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.tray]
drawer = true
icon_color = "primary"
match_adjacent_spacing = true

[widget.weather]
icon_color = "primary"

[widget.workspaces]
empty_color = "surface_variant"
label_source = "name"
labels_only_when_occupied = true
max_label_chars = 5
occupied_color = "surface_variant"
scale = 1.05
show_tooltip = false
