# plasmashell's quick settings brightness slider takes PowerDevil's D-Bus object at
# construction and never re-checks its availability, so if PowerDevil is not on the bus yet
# the slider stays hidden for the whole session (seen after a Steam Game Mode round trip).
#
# An After=plasma-powerdevil.service edge cannot be used: plasma-powerdevil.service is
# After=plasma-core.target, and plasma-core.target pulls plasmashell in, so the edge forms
# an ordering cycle that systemd breaks by deleting the plasmashell start job — black
# screen on session start. Wait for the interface instead: bounded, and never fatal.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ "$i" -lt 60 ]; do busctl --user call org.kde.Solid.PowerManagement /org/kde/Solid/PowerManagement/Actions/BrightnessControl org.kde.Solid.PowerManagement.Actions.BrightnessControl brightness >/dev/null 2>&1 && exit 0; i=$((i+1)); sleep 0.1; done; exit 0'
