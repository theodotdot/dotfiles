# plasmashell's quick settings brightness slider takes PowerDevil's D-Bus object at
# construction and never re-checks its availability, so if PowerDevil is not on the bus
# yet the slider stays hidden for the whole session (seen after a Steam Game Mode
# round trip, where plasmashell starts ~3 s before powerdevil).
# plasma-powerdevil.service is Type=dbus, so After= holds the shell back until
# org.kde.Solid.PowerManagement is actually owned.
[Unit]
After=plasma-powerdevil.service
Wants=plasma-powerdevil.service
