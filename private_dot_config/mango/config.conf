# ============================================================================
# mangowm 0.18.5 — AYN Thor (SM8550 / pocknix)
#
# Ported from ~/.config/niri/config.kdl + ~/.config/niri/blur.kdl
# (chezmoi branch: thor). Every action name and key below was checked against
# the mangowm 0.18.5 source, not guessed from docs.
#
# Validate before using:
#   mango -c ~/.config/mango/config.conf -p
# ============================================================================


# ----------------------------------------------------------------------------
# TOUCH — the whole reason for running Mango on this device
#
# With no rule, mango's device_target_monitor() falls back to
# server.selected_monitor, i.e. the monitor that currently has focus. On a Thor
# that means a touch is routed by whatever has focus rather than by which panel
# was touched — the exact bug niri PR #1856 exists to fix.
#
# These two rules are therefore MANDATORY, not tuning. The names are the kernel
# /libinput names and they differ per panel on this device (unlike a Yoga Book
# 9i, where both panels report one identical name):
#
#   bottom panel -> bottom_touchscreen (/dev/input/event4) -> DSI-1
#   top panel    -> top_touchscreen    (/dev/input/event5) -> DSI-2
#
# Confirm the names with:  mmsg get all-devices
# Confirm the mapping with mango -d, which logs per device:
#   "Mapping touch bottom_touchscreen to output DSI-1"
# ----------------------------------------------------------------------------
device_rule=name:bottom_touchscreen,monitor:DSI-1
device_rule=name:top_touchscreen,monitor:DSI-2

touch_enable=1
# Left at 0 = pure wl_touch. Raise to 1 only if some app ignores touches; it
# then emulates a left click for the first touch point, which also routes taps
# on non-touch surfaces through the pointer path.
touch_enable_mouse_emulation=0


# ----------------------------------------------------------------------------
# MONITORS  (niri: output "DSI-2" / "DSI-1" / "DP-1")
#
# Both panels run wl_output transform 3. The live Plasma session reports
# "Rotation: 8" (90 deg clockwise) on BOTH connectors, and 90 CW == 270 CCW ==
# transform 3 == rr:3.
#
# !! This is the one place I deviated from the niri config. !!
# niri/config.kdl had no transform on DSI-1 ("already landscape"), which yields
# a portrait 432x496 bottom panel. rr:3 yields 496x432, which matches the
# physical panel and what Plasma does. If the bottom picture comes out wrong,
# that single number is the fix: 3 for landscape, 0 for the old niri behaviour.
#
# Logical sizes at scale 2.5 (niri used 2.5 on both panels):
#   DSI-2: 1920x1080 physical -> 768x432
#   DSI-1: 1240x1080 physical -> 496x432
# DSI-1 sits below DSI-2, horizontally centred: (768-496)/2 = 136.
#
# Keep every coordinate positive — XWayland breaks click mapping on negative
# positions (documented wlroots/mango caveat).
# ----------------------------------------------------------------------------
monitor_rule=name:^DSI-2$,width:1080,height:1920,refresh:60,scale:2.5,rr:3,x:0,y:0,primary:1
monitor_rule=name:^DSI-1$,scale:2.5,rr:3,x:136,y:432
monitor_rule=name:^DP-1$,scale:1.5,rr:0,x:768,y:0


# ----------------------------------------------------------------------------
# ENVIRONMENT  (niri: environment { })
# NOTE: mango re-applies these on every config reload.
# ----------------------------------------------------------------------------
env=XDG_SESSION_TYPE,wayland
env=SDL_VIDEODRIVER,wayland
env=EGL_PLATFORM,wayland
env=EDITOR,hx
env=QT_STYLE_OVERRIDE,kvantum
env=QT_QPA_PLATFORM,wayland
env=GTK_THEME,catppuccin-macchiato-mauve-standard+default
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=GTK_IM_MODULE,cedilla
env=QT_IM_MODULE,cedilla

# ---------------------------------------------------------------------------
# THE DPU / 120Hz ISSUE — why DSI-2 is pinned to 60Hz above.
#
# At DSI-2's native 120Hz the msm DPU faults continuously and the panel goes
# black while DSI-1 flickers:
#   arm-smmu 15000000.iommu: Unhandled context fault: fsr=0x402, SID=0x1c00
# apps_smmu lives at 0x15000000 and mdss declares
# `iommus = <&apps_smmu 0x1c00 0x2>;`, so this is the DISPLAY CONTROLLER reading
# unmapped IOVA — not the GPU (which has its own adreno_smmu). DSI-2 is
# COMMAND-mode so a failed fetch never kicks off a frame (black); DSI-1 is
# VIDEO-mode so it keeps streaming (flicker).
#
# Measured, faults per 15s, one variable at a time:
#   120Hz                             -> 60  (rate-limited; 45k+ suppressed first)
#    60Hz                             ->  0
#   120Hz + WLR_DRM_NO_MODIFIERS=1    -> 60  no effect
#   120Hz + sync_obj_enable=0         -> 60  no effect
#   120Hz + WLR_DRM_NO_ATOMIC=1       ->  0  works, but legacy path: no planes
# Rotation (rr:3) and scale 2.5 are NOT contributors; both are clean at 60Hz.
# So the trigger is the 120Hz mode on the atomic commit path. Not yet fixed.
#
# DO NOT add env=WLR_EGL_NO_MODIFIERS,1 to "fix" 120Hz. It reads as 0 faults but
# rendering is broken and mango sits at 99-100% CPU on one core:
#   [render/egl.c:748] EGL implementation doesn't support modifiers
#   [types/buffer/client.c:109] Failed to create texture   (x5366 in 100s)
# and mmsg stops responding. The fault counter is only clean because client
# buffers never reach the display. Verify faults together with CPU and those
# texture errors, or this false positive comes back.
#
# To try 120Hz later: remove refresh:60 and add env=WLR_DRM_NO_ATOMIC,1, then
# check CPU, power and whether rotation/direct scanout still behave.
# KWin runs this same panel at 120Hz fine, so this is most likely a wlroots
# DRM-backend bug on msm rather than a panel/DPU limit.
# ---------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# KEYBOARD  (niri: input { keyboard { xkb { } } })
# ----------------------------------------------------------------------------
xkb_rules_layout=us,fr
xkb_rules_variant=intl,ergol
xkb_rules_options=grp:alt_space_toggle
repeat_rate=25
repeat_delay=600
numlock_on=0


# ----------------------------------------------------------------------------
# CURSOR  (niri: cursor { })
# ----------------------------------------------------------------------------
env=XCURSOR_THEME,catppuccin-macchiato-dark-cursors
env=XCURSOR_SIZE,20
cursor_size=20
cursor_hide_timeout=10
cursor_hide_on_keypress=1


# ----------------------------------------------------------------------------
# APPEARANCE
# niri: layout { gaps 5; border { width 2; active "#c6a0f6"; inactive "#b8c0e0" } }
#       overview { backdrop-color "#24273a" }
#       window-rule { geometry-corner-radius 5 }
#       blur: window opacity 0.92 + background-effect blur
# mango colours are 0xRRGGBBAA.
# ----------------------------------------------------------------------------
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5

border_px=2
border_radius=5
focus_color=0xc6a0f6ff
border_color=0xb8c0e0ff
root_color=0x24273aff

# niri had global window opacity 0.92 with blur behind; kitty and the noctalia
# settings window were pinned opaque in window rules below.
focused_opacity=0.92
unfocused_opacity=0.92
blur=1
blur_layer=1
blur_optimized=1

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1

# niri had focus-follows-mouse commented out (disabled); mango defaults to 1.
sloppy_focus=0
warp_cursor=1


# ----------------------------------------------------------------------------
# TAGS / LAYOUT
# niri is a scrollable tiling compositor, so `scroller` is the closest analogue
# to what you were used to. Use `tile` for classic dwm-style master/stack.
# niri workspaces main/chat/games map to tags 1/2/3 (see window rules).
# ----------------------------------------------------------------------------
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller


# ----------------------------------------------------------------------------
# WINDOW RULES  (niri: window-rule { })
# mango rules are AND within a rule and the first matching rule wins, so a rule
# cannot express niri's "all Telegram windows except the media viewer".
# ----------------------------------------------------------------------------

# niri: zen -> workspace "main"
window_rule=app_id:^zen$,tags:1

# niri: prismlauncher + steam -> workspace "games"
window_rule=app_id:^org\.prismlauncher\.PrismLauncher$,tags:3
window_rule=app_id:^steam$,tags:3

# niri: steam_app_* -> open-fullscreen true
window_rule=app_id:^steam_app_[0-9]+,tags:3,is_fullscreen:1

# niri: telegram + vesktop -> workspace "chat"
window_rule=app_id:^org\.telegram\.desktop$,tags:2
window_rule=app_id:^vesktop$,tags:2

# niri: picture-in-picture + localsend -> open-floating true
window_rule=title:^(Picture-in-Picture|Picture in Picture|Localsend)$,is_floating:1

# niri: keepassxc -> block-out-from "screen-capture"
window_rule=app_id:^org\.keepassxc\.KeePassXC$,shield_when_capture:1

# blur.kdl: kitty draws its own transparency (background_opacity in kitty.conf)
window_rule=app_id:^kitty$,focused_opacity:1.0,unfocused_opacity:1.0

# niri: noctalia settings window floating at a fixed size
window_rule=app_id:^dev\.noctalia\.Noctalia$,is_floating:1,width:1080,height:920,focused_opacity:1.0,unfocused_opacity:1.0


# ----------------------------------------------------------------------------
# AUTOSTART  (niri: spawn-at-startup)
# exec_once = once at startup; exec = on every config reload.
# ----------------------------------------------------------------------------
exec_once=dbus-update-activation-environment --systemd
exec_once=noctalia
exec_once=zen-browser
exec_once=vesktop
exec_once=Telegram


# ----------------------------------------------------------------------------
# BINDS
# niri's "Mod" == Super on a TTY. Format: bind=MODS,key,action,arg
# ----------------------------------------------------------------------------

# --- utilities (niri: Mod+Return / space / S / V / A / minus / Ctrl+Alt+L) ---
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER+SHIFT,space,spawn_shell,noctalia msg panel-toggle launcher /
bind=SUPER,S,spawn_shell,noctalia msg settings-toggle
bind=SUPER,V,spawn_shell,noctalia msg panel-toggle clipboard
bind=SUPER,A,spawn_shell,noctalia msg panel-toggle control-center
bind=SUPER,minus,spawn_shell,kitty +kitten quick-access-terminal
bind=CTRL+ALT,L,spawn_shell,noctalia msg session lock

# --- shell / compositor ---
bind=SUPER,N,toggleoverview,1
bind=SUPER,O,spawn_shell,noctalia msg config-reload
# reload_config on SUPER+SHIFT+r: mango matches key names case-insensitively,
# so SUPER,r and SUPER,R are the same chord. niri's Mod+R (proportion preset)
# keeps SUPER+r below.
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,m,quit
bind=SUPER+SHIFT,P,sleep_toggle_monitor,

# --- screenshots (niri: Mod+Print / Print / Mod+Shift+Print) ---
bind=SUPER,Print,spawn_shell,noctalia msg screenshot-region
# bare Print needs the explicit "none" modifier column
bind=none,Print,spawn_shell,noctalia msg screenshot-fullscreen pick
bind=SUPER+SHIFT,Print,spawn_shell,noctalia msg screenshot-window

# --- audio / media (niri: XF86* keys) ---
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86AudioPlay,spawn,playerctl --ignore-player=firefox play-pause
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next

# --- window manipulation (niri: Mod+Q / Shift+T / F / Shift+F / R) ---
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,T,togglefloating,
bind=SUPER,F,togglemaximizescreen,
bind=SUPER+SHIFT,F,togglefullscreen,
bind=SUPER,R,switch_proportion_preset,

# --- focus (niri: Mod+arrows, Mod+Down/Up = window-or-workspace) ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focus_window_or_workspace,up
bind=SUPER,Down,focus_window_or_workspace,down

# --- focus another output (niri: Mod+Alt+arrows) ---
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT,Up,focusmon,up
bind=SUPER+ALT,Down,focusmon,down

# --- move window (niri: Mod+Shift+arrows) ---
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# --- tags (niri: Mod+1..9 focus-workspace, Mod+Shift+1..9 move to workspace) ---
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# niri: Mod+Tab / Mod+Shift+Tab = focus-workspace-down/up
bind=SUPER,Tab,viewnext_have_client,0
bind=SUPER+SHIFT,Tab,viewprev_have_client,0


# ----------------------------------------------------------------------------
# MOUSE
# ----------------------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# ----------------------------------------------------------------------------
# GESTURES (touchpad fingers; the Thor also has a trackpad-less layout, these
# are harmless if unused)
# ----------------------------------------------------------------------------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# ----------------------------------------------------------------------------
# NOT PORTED — niri features with no mangowm 0.18.5 equivalent.
# Listed so nothing is silently lost.
#
#   Mod+D / Mod+Shift+D / Mod+Alt+D (DP-1 scale 1 / 2 / 1.5)
#       mango has no runtime output-scale action. Change monitor_rule above and
#       SUPER+r, or use `mmsg dispatch` on a monitor_rule reload.
#   Mod+Ctrl+Left/Right (set-column-width +-10%) and Mod+Shift+R (column height)
#       no relative proportion action; SUPER+R cycles presets instead.
#   Mod+T (switch-focus-between-floating-and-tiling), Mod+W (tabbed columns),
#   Mod+BracketLeft/Right, Mod+Comma/Period, Mod+Shift+Home/End, Mod+Home/End
#       niri column model has no dwm-tags analogue.
#   Mod+Escape (keyboard-shortcuts-inhibit toggle)
#   Mod+Shift+O (toggle window-rule opacity)
#   Mod+Ctrl+F (expand column), Mod+Shift+C (centre column)
#   blur.kdl layer rules
#       mango layer_rule can only disable effects (no_blur / no_shadow), not
#       enable blur per namespace. blur_layer=1 covers noctalia's surfaces.
#       noctalia-wallpaper place-within-backdrop has no equivalent.
#   prefer-no-csd, screenshot-path, overview { backdrop-color; zoom },
#   animation custom shaders, debug { honor-xdg-activation-with-invalid-serial }
#   Ctrl+Alt+Delete (quit has no confirmation dialogue in mango — deliberately
#       left unbound so a stray combo cannot end the session)
# ============================================================================
