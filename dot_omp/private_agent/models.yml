providers:
  deepseek:
    baseUrl: https://api.deepseek.com
    api: openai-completions
    apiKey: DEEPSEEK_API_KEY
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 384000
        cost:
          input: 0.15
          output: 0.6
          cacheRead: 0.003
          cacheWrite: 0.6
        thinking:
          mode: effort
          efforts: [low, medium, high]
          defaultLevel: medium
